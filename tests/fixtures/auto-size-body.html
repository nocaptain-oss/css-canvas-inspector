<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Auto size body poster</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 540px;
        overflow: hidden;
      }

      body {
        background: #101014;
        color: #f0f0f2;
      }
    </style>
  </head>
  <body>
    <h1>Fixed 1080 x 540 body</h1>
  </body>
</html>
