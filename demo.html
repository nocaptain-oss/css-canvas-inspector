<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>CSS Canvas Inspector Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1440px;
      margin: 0;
      overflow: hidden;
    }
    body {
      background: #f4efe3;
      color: #191b1e;
      font-family: "PingFang SC", "HarmonyOS Sans SC", sans-serif;
    }
    .poster {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 72px;
      background:
        radial-gradient(circle at 12% 4%, #fffdf7, transparent 34%),
        linear-gradient(155deg, #faf6ec, #eee5d5);
    }
    .kicker {
      font: 700 30px/1 "SFMono-Regular", "Menlo", monospace;
      letter-spacing: 0.08em;
    }
    h1 {
      margin: 160px 0 0;
      font-size: 142px;
      line-height: 0.98;
      letter-spacing: -0.07em;
    }
    em { color: #e94e35; font-style: normal; }
    p {
      position: absolute;
      right: 72px;
      bottom: 82px;
      left: 72px;
      margin: 0;
      color: #625c52;
      font-size: 30px;
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="kicker">CSS CANVAS INSPECTOR</div>
    <h1>选择元素<br>直接改 <em>CSS</em></h1>
    <p>相对微调，或切换到画布绝对坐标。</p>
  </main>
</body>
</html>
