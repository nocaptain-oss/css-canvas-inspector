<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Canvas Inspector</title>
  <link rel="stylesheet" href="./src/inspector.css?v=0.3.5">
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">
        <strong id="toolName">CSS Canvas Inspector</strong>
        <span id="toolMeta"></span>
      </div>

      <div class="segmented" id="variantSwitch" hidden aria-label="选择变体"></div>

      <div class="segmented" id="canvasModeSwitch" hidden aria-label="画布显示模式">
        <button type="button" data-canvas-mode="single" class="active">单画布</button>
        <button type="button" data-canvas-mode="dual">双画布</button>
      </div>

      <label id="frameControl" hidden>
        帧
        <select id="frameSelect"></select>
      </label>

      <label id="pageControl" hidden title="多画布模式：源页面中每个匹配节点是一张独立画布">
        画布
        <select id="pageSelect" aria-label="选择画布页"></select>
      </label>

      <div class="toolbar-spacer"></div>

      <button id="undoButton" class="tool-button compact" disabled>撤销</button>
      <button id="redoButton" class="tool-button compact" disabled>重做</button>
      <button id="resetAll" class="tool-button" disabled>重置当前方案</button>

      <label class="export-field" title="导出宽度">
        <input id="exportWidth" type="number" min="1" step="1" value="1280" aria-label="导出宽度">
        <span>px</span>
      </label>
      <select id="exportFormat" class="export-format" aria-label="导出格式">
        <option value="jpg" selected>JPG</option>
        <option value="png">PNG</option>
        <option value="webp">WebP</option>
      </select>
      <label class="export-field" id="frameTimingField" hidden title="动画 WebP 每帧停留时长">
        <input id="frameDuration" type="number" min="20" step="10" value="80" aria-label="每帧时长">
        <span>ms/帧</span>
      </label>
      <label class="export-field" id="frameHoldField" hidden title="动画 WebP 最后一帧额外停留时长">
        <input id="frameHold" type="number" min="0" step="100" value="0" aria-label="末帧停留">
        <span>ms 停留</span>
      </label>
      <button id="downloadCanvas" class="tool-button primary" disabled>下载当前画布</button>
      <button id="downloadHtml" class="tool-button" disabled>下载 HTML</button>
    </header>

    <main class="workspace">
      <section class="canvas-pane">
        <div class="canvas-bar">
          <span id="canvasHint">点击画布中的文字或图形进行选择</span>
          <div class="zoom-controls" aria-label="画布缩放">
            <button id="zoomOut" type="button" title="缩小">−</button>
            <input id="zoomRange" type="range" min="5" max="300" step="5" value="60" aria-label="缩放比例">
            <output id="zoomLabel">FIT</output>
            <button id="zoomIn" type="button" title="放大">+</button>
            <button id="zoomFit" type="button">适应</button>
            <button id="zoomActual" type="button">100%</button>
          </div>
        </div>
        <div class="stage-space" id="stageSpace">
          <div class="stage-row" id="stageRow">
            <div class="stage-slot active" id="slot0" data-slot="0">
              <span class="stage-label" id="stageLabel0"></span>
              <div class="stage" id="stage0">
                <iframe id="coverFrame" title="编辑画布" tabindex="0"></iframe>
              </div>
            </div>
            <div class="stage-slot" id="slot1" data-slot="1" hidden>
              <span class="stage-label" id="stageLabel1"></span>
              <div class="stage" id="stage1">
                <iframe id="compareFrame" title="对比画布" tabindex="0"></iframe>
              </div>
            </div>
          </div>
          <div class="load-error" id="loadError" hidden>
            <strong>无法访问画布</strong>
            <span id="loadErrorText">请确认源页面和检查器使用同一本地服务器。</span>
          </div>
        </div>
      </section>

      <aside class="inspector">
        <section class="selection-block">
          <div class="selection-topline">
            <span class="selection-label">当前图层</span>
            <select class="active-canvas" id="activeCanvasSelect" aria-label="当前编辑画布">
              <option value="0">画布 1</option>
            </select>
          </div>
          <label class="layer-select-field">
            <span>选择元素</span>
            <select id="elementSelect"></select>
          </label>
          <div class="selection-name" id="selectionName">未选择</div>
          <div class="selection-path" id="selectionPath">点击左侧画布选择元素</div>
          <div class="selection-actions">
            <button id="resetSelected" disabled>重置此元素</button>
            <button id="deleteSelected" disabled title="删除选中元素（Delete 键）">删除元素</button>
          </div>
        </section>

        <fieldset class="inspector-fields" id="inspectorFields" disabled>
          <section class="panel-section" id="textSection" hidden>
            <h2>文本内容</h2>
            <label class="field wide" id="textNodeField" hidden>
              <span>可编辑文字片段</span>
              <select id="textNodeSelect"></select>
            </label>
            <label class="field wide">
              <span>直接文字节点</span>
              <textarea id="textValue"></textarea>
            </label>
            <p class="hint" id="textHint" hidden>该元素只包含子元素，请点击其中的文字子元素。</p>
          </section>

          <section class="panel-section">
            <h2>位置与尺寸</h2>
            <div class="mode-toggle" role="group" aria-label="坐标模式">
              <button type="button" data-position-mode="relative" class="active">相对微调</button>
              <button type="button" data-position-mode="absolute">绝对坐标</button>
            </div>
            <div class="field-grid four">
              <label class="field"><span>X</span><input id="xValue" type="number" step="1"></label>
              <label class="field"><span>Y</span><input id="yValue" type="number" step="1"></label>
              <label class="field"><span>宽</span><input id="widthValue" type="number" step="1"></label>
              <label class="field"><span>高</span><input id="heightValue" type="number" step="1"></label>
            </div>
            <div class="field-grid" style="margin-top:10px">
              <label class="field"><span>层级 z-index</span><input id="zIndex" type="number" step="1"></label>
            </div>
            <p class="hint" id="positionHint" style="margin-top:8px">
              X / Y 是相对原位置的微调，不会打乱其他元素。
            </p>
          </section>

          <section class="panel-section">
            <h2>文字</h2>
            <div class="field-grid">
              <label class="field"><span>字号 px</span><input id="fontSize" type="number" min="1" step="1"></label>
              <label class="field"><span>字重</span><input id="fontWeight" type="number" min="100" max="900" step="50"></label>
              <label class="field"><span>行高 px</span><input id="lineHeight" type="number" min="0" step="1"></label>
              <label class="field"><span>字间距 px</span><input id="letterSpacing" type="number" step="0.1"></label>
              <label class="field"><span>颜色</span><input id="colorValue" type="color"></label>
              <label class="field"><span>对齐</span>
                <select id="textAlign">
                  <option value="left">左对齐</option>
                  <option value="center">居中</option>
                  <option value="right">右对齐</option>
                </select>
              </label>
            </div>
          </section>

          <section class="panel-section">
            <h2>间距</h2>
            <div class="field-grid four">
              <label class="field"><span>上</span><input id="marginTop" type="number" step="1"></label>
              <label class="field"><span>右</span><input id="marginRight" type="number" step="1"></label>
              <label class="field"><span>下</span><input id="marginBottom" type="number" step="1"></label>
              <label class="field"><span>左</span><input id="marginLeft" type="number" step="1"></label>
            </div>
            <div class="field-grid four" style="margin-top:10px">
              <label class="field"><span>内上</span><input id="paddingTop" type="number" step="1"></label>
              <label class="field"><span>内右</span><input id="paddingRight" type="number" step="1"></label>
              <label class="field"><span>内下</span><input id="paddingBottom" type="number" step="1"></label>
              <label class="field"><span>内左</span><input id="paddingLeft" type="number" step="1"></label>
            </div>
          </section>

          <section class="panel-section">
            <h2>高级 CSS</h2>
            <label class="field wide">
              <span>例如：background: #fff; opacity: .8;</span>
              <textarea id="advancedCss" placeholder="property: value;"></textarea>
            </label>
            <button type="button" class="apply-css" id="applyCss">应用到当前元素</button>
            <p class="hint" id="applyStatus" style="margin-top:8px">选中元素后可编辑。</p>
          </section>
        </fieldset>
      </aside>
    </main>
  </div>

  <script src="./src/vendor/html2canvas.min.js?v=0.3.5"></script>
  <script type="module" src="./src/inspector.js?v=0.3.5"></script>
</body>
</html>
